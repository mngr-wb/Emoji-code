<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字暗号ツール</title>
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="文字暗号ツール">
<meta property="og:description" content="ひらがな・カタカナを絵文字に変換する暗号ツール。オリジナルの暗号表を作成してシェアできます。">
<meta property="og:image" content="https://zerostudio428.github.io/Emoji-code/banner.png">
<meta property="og:url" content="https://zerostudio428.github.io/Emoji-code/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9338200315662616"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
  <header>
    <div class="title">文字暗号ツール</div>
    <div class="subtitle">絵文字 ⇄ 文字 変換</div>
  </header>

  <div class="card">
    <div class="mode-tabs">
      <button class="tab active" onclick="setMode('decode')">絵文字 → 文字</button>
      <button class="tab" onclick="setMode('encode')">文字 → 絵文字</button>
    </div>

    <div id="decode-section">
      <label>入力（絵文字を貼り付け）</label>
      <textarea id="decode-input" placeholder='例：🎒🐨🐱🍅"🧸🌙🥁🔥🦑🌙🥁🍑🛷🍅' oninput="decode()" rows="3"></textarea>
      <div class="arrow">↓</div>
      <label>変換結果</label>
      <div class="output-wrap">
        <div class="output-box text-output" id="decode-output">
          <span class="placeholder-text">ここに文字が表示されます</span>
        </div>
        <button class="copy-btn" onclick="copyOutput('decode-output')">コピー</button>
      </div>
      <div class="share-panel is-disabled" id="decode-share">
        <div class="share-label">結果を共有</div>
        <div class="share-buttons">
          <button class="share-btn share-x" onclick="shareOutput('decode-output', 'x')" disabled>X</button>
          <button class="share-btn share-line" onclick="shareOutput('decode-output', 'line')" disabled>LINE</button>
          <button class="share-btn share-bluesky" onclick="shareOutput('decode-output', 'bluesky')" disabled>Bluesky</button>
          <button class="share-btn share-native" onclick="shareOutput('decode-output', 'native')" disabled>共有</button>
        </div>
      </div>
    </div>

    <div id="encode-section" style="display:none">
      <label>入力（ひらがな・カタカナ）</label>
      <textarea id="encode-input" placeholder="例：らくてん" oninput="encode()" rows="3"></textarea>
      <div class="arrow">↓</div>
      <label>変換結果</label>
      <div class="output-wrap">
        <div class="output-box" id="encode-output">
          <span class="placeholder-text">ここに絵文字が表示されます</span>
        </div>
        <button class="copy-btn" onclick="copyOutput('encode-output')">コピー</button>
      </div>
      <div class="share-panel is-disabled" id="encode-share">
        <div class="share-label">結果を共有</div>
        <div class="share-buttons">
          <button class="share-btn share-x" onclick="shareOutput('encode-output', 'x')" disabled>X</button>
          <button class="share-btn share-line" onclick="shareOutput('encode-output', 'line')" disabled>LINE</button>
          <button class="share-btn share-bluesky" onclick="shareOutput('encode-output', 'bluesky')" disabled>Bluesky</button>
          <button class="share-btn share-native" onclick="shareOutput('encode-output', 'native')" disabled>共有</button>
        </div>
      </div>
    </div>
  </div>

  <section class="monetize-card" aria-label="PR">
    <div class="ad-label">PR</div>
    <a class="ad-link" href="https://hb.afl.rakuten.co.jp/hgc/543d02d0.88e52cb9.543d02d1.51091342/?pc=https%3A%2F%2Fsearch.rakuten.co.jp%2Fsearch%2Fmall%2F%E3%83%81%E3%82%A7%E3%82%AD%E5%B8%B3%2F&link_type=text&ut=eyJwYWdlIjoidXJsIiwidHlwZSI6InRleHQiLCJjb2wiOjF9" rel="sponsored nofollow">
      <span class="ad-title">チェキ帳を探す</span>
      <span class="ad-copy">現場や特典会のチェキをまとめておける推し活グッズ</span>
    </a>
    <p class="ad-disclosure">当サイトは楽天アフィリエイトを利用しています。</p>
  </section>

  <div class="table-card">
    <div class="table-header" onclick="toggleTable()">
      <div class="table-title">📋 暗号表を見る</div>
      <div class="toggle-icon" id="toggle-icon">▼</div>
    </div>
    <div id="table-body" style="display:none">
      <div class="dakuten-note">
        💡 濁点・半濁点のある文字（が、ば、ぱ など）は、元の絵文字の後ろに <strong>"</strong> または <strong>'</strong> をつけます。<br>
        例：らくてん → 🎒🐨🐱🍅"🧸🌙🥁🔥🦑🌙🥁🍑🛷🍅（楽天 ＝ ら・く・て・ん → て" = で）
      </div>
      <div class="table-controls">
        <button class="ctrl-btn" id="edit-btn" onclick="toggleEditMode()">カスタマイズ</button>
        <button class="ctrl-btn reset-btn" id="reset-btn" onclick="resetCipher()" style="display:none">デフォルトに戻す</button>
      </div>
      <div class="cipher-grid" id="cipher-grid"></div>

      <div class="custom-chars-section">
        <div class="custom-chars-header">
          <span class="favorites-title">＋ 特殊文字の変換</span>
          <button class="ctrl-btn" onclick="addCustomChar()">追加</button>
        </div>
        <div id="custom-chars-list"></div>
      </div>

      <div class="favorites-section">
        <div class="favorites-title">★ お気に入り設定</div>
        <div class="save-row">
          <input type="text" id="fav-name-input" class="fav-name-input"
                 placeholder="設定に名前をつけて保存"
                 onkeydown="if(event.key==='Enter') saveFavorite()">
          <button class="ctrl-btn fav-save-btn" onclick="saveFavorite()">保存</button>
        </div>
        <div id="favorites-list"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="privacy.html">プライバシーポリシー</a>
  </footer>
</div>

<script src="script.js?v=20260529"></script>
</body>
</html>
