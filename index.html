<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メン地下暗号ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="title">メン地下 暗号ツール 🔐</div>
    <div class="subtitle">絵文字 ⇄ 文字 変換</div>
  </header>

  <div class="card">
    <div class="mode-tabs">
      <button class="tab active" onclick="setMode('encode')">文字 → 絵文字</button>
      <button class="tab" onclick="setMode('decode')">絵文字 → 文字</button>
    </div>

    <div id="encode-section">
      <label>入力（ひらがな・カタカナ）</label>
      <textarea id="encode-input" placeholder="例：らくてん" oninput="encode()" rows="3"></textarea>
      <div class="arrow">↓</div>
      <label>変換結果</label>
      <div class="output-wrap">
        <div class="output-box" id="encode-output">
          <span class="placeholder-text">ここに絵文字が表示されます</span>
        </div>
        <button class="copy-btn" onclick="copyOutput('encode-output')">コピー</button>
      </div>
    </div>

    <div id="decode-section" style="display:none">
      <label>入力（絵文字を貼り付け）</label>
      <textarea id="decode-input" placeholder='例：🎒🐨🐱🍅"🧸🌙🥁🔥🦑🌙🥁🍑🛷🍅' oninput="decode()" rows="3"></textarea>
      <div class="arrow">↓</div>
      <label>変換結果</label>
      <div class="output-wrap">
        <div class="output-box text-output" id="decode-output">
          <span class="placeholder-text">ここに文字が表示されます</span>
        </div>
        <button class="copy-btn" onclick="copyOutput('decode-output')">コピー</button>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header" onclick="toggleTable()">
      <div class="table-title">📋 暗号表を見る</div>
      <div class="toggle-icon" id="toggle-icon">▼</div>
    </div>
    <div id="table-body" style="display:none">
      <div class="dakuten-note">
        💡 濁点・半濁点のある文字（が、ば、ぱ など）は、元の絵文字の後ろに <strong>"</strong> または <strong>'</strong> をつけます。<br>
        例：らくてん → 🎒🐨🐱🍅"🧸🌙🥁🔥🦑🌙🥁🍑🛷🍅（楽天 ＝ ら・く・て・ん → て" = で）
      </div>
      <div class="cipher-grid" id="cipher-grid"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
