<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00000018"/>
    </filter>
    <filter id="dot-blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f5f0"/>

  <!-- Decorative background blobs -->
  <circle cx="60"   cy="80"  r="130" fill="#e8e8e3" opacity="0.55"/>
  <circle cx="1150" cy="560" r="160" fill="#e8e8e3" opacity="0.55"/>
  <circle cx="30"   cy="580" r="90"  fill="#dededb" opacity="0.4"/>
  <circle cx="1170" cy="90"  r="100" fill="#dededb" opacity="0.4"/>
  <!-- Small accent dots -->
  <circle cx="220"  cy="40"  r="14"  fill="#d8d8d4" opacity="0.6"/>
  <circle cx="980"  cy="598" r="18"  fill="#d8d8d4" opacity="0.6"/>
  <circle cx="1100" cy="200" r="10"  fill="#d0d0cc" opacity="0.5"/>
  <circle cx="110"  cy="420" r="12"  fill="#d0d0cc" opacity="0.5"/>

  <!-- Card shadow -->
  <rect x="104" y="84" width="992" height="462" rx="22" fill="#00000010"/>

  <!-- Main card -->
  <rect x="100" y="80" width="992" height="460" rx="22"
        fill="#ffffff" stroke="#e8e8e4" stroke-width="1.5"/>

  <!-- Top accent bar -->
  <rect x="100" y="80" width="992" height="6" rx="3" fill="#222222"/>

  <!-- Lock icon -->
  <!-- body -->
  <rect x="571" y="150" width="58" height="46" rx="11" fill="#222222"/>
  <!-- shackle -->
  <path d="M584,150 L584,132 Q584,114 600,114 Q616,114 616,132 L616,150"
        fill="none" stroke="#222222" stroke-width="8" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="600" cy="170" r="7" fill="#f5f5f0"/>
  <rect x="596.5" y="176" width="7" height="11" rx="3.5" fill="#f5f5f0"/>

  <!-- Title -->
  <text x="600" y="274"
        font-family="'Hiragino Kaku Gothic Pro','YuGothic','Yu Gothic','Meiryo','BIZ UDPGothic',sans-serif"
        font-size="68" font-weight="700" fill="#222222"
        text-anchor="middle" dominant-baseline="middle">文字暗号ツール</text>

  <!-- Subtitle -->
  <text x="600" y="334"
        font-family="'Hiragino Kaku Gothic Pro','YuGothic','Yu Gothic','Meiryo',sans-serif"
        font-size="26" fill="#999999"
        text-anchor="middle" letter-spacing="3">絵文字 ⇄ 文字 変換</text>

  <!-- Divider -->
  <line x1="360" y1="368" x2="840" y2="368" stroke="#e8e8e4" stroke-width="1.5"/>

  <!-- Cipher cell row (8 cells: あいうえおかきく) -->
  <!-- Cell w=82, gap=10, total=736, startX=(1200-736)/2=232 -->

  <!-- あ -->
  <rect x="232" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="273" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">あ</text>
  <text x="273" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🍨</text>

  <!-- い -->
  <rect x="324" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="365" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">い</text>
  <text x="365" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🦑</text>

  <!-- う -->
  <rect x="416" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="457" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">う</text>
  <text x="457" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🐴</text>

  <!-- お -->
  <rect x="508" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="549" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">お</text>
  <text x="549" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">👹</text>

  <!-- く -->
  <rect x="600" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="641" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">く</text>
  <text x="641" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🐻</text>

  <!-- こ -->
  <rect x="692" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="733" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">こ</text>
  <text x="733" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🐨</text>

  <!-- ぬ -->
  <rect x="784" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="825" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">ぬ</text>
  <text x="825" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🧸</text>

  <!-- ね -->
  <rect x="876" y="382" width="82" height="76" rx="11" fill="#fafaf8" stroke="#f0f0eb" stroke-width="1.2"/>
  <text x="917" y="400" font-family="'Hiragino Kaku Gothic Pro','YuGothic',sans-serif"
        font-size="12" font-weight="700" fill="#aaaaaa" text-anchor="middle">ね</text>
  <text x="917" y="440" font-size="26" text-anchor="middle" dominant-baseline="middle">🐱</text>

  <!-- URL -->
  <text x="600" y="504"
        font-family="'SF Mono','Consolas','Lucida Console',monospace"
        font-size="16" fill="#cccccc" text-anchor="middle">
    mngr-wb.github.io/Emoji-code
  </text>
</svg>
